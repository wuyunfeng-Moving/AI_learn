<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹珠游戏</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }

        .title {
            text-align: center;
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-fire {
            background: #f44336;
            color: white;
        }

        .btn-fire:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .odds-display {
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }

        .game-board {
            position: relative;
            width: 100%;
            height: 600px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #16213e;
            display: flex;
        }

        .launch-area {
            width: 120px;
            height: 100%;
            background: #2a2a4e;
            border-right: 3px solid #16213e;
            position: relative;
        }

        .game-container-inner {
            flex: 1;
            position: relative;
            background: #1a1a2e;
            border: 3px solid #444;
            border-radius: 5px;
            margin: 10px;
        }

        .launch-tube {
            position: absolute;
            bottom: 50px;
            right: 10px;
            width: 30px;
            height: 100px;
            background: linear-gradient(to top, #333, #555);
            border-radius: 15px;
            border: 2px solid #666;
        }

        .launch-curve {
            position: absolute;
            bottom: 150px;
            right: 10px;
            width: 80px;
            height: 80px;
            border: 3px solid #666;
            border-bottom: none;
            border-right: none;
            border-radius: 0 0 0 40px;
            background: transparent;
        }

        .launch-horizontal {
            position: absolute;
            top: 20px;
            left: 10px;
            right: 90px;
            height: 30px;
            border-top: 3px solid #666;
            border-bottom: 3px solid #666;
            background: linear-gradient(to bottom, #555, #333);
        }

        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #fff, #ff4444, #cc0000);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            transition: none;
            z-index: 100;
        }

        .peg {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle at 30% 30%, #fff, #888, #333);
            border-radius: 50%;
            border: 1px solid #555;
        }

        .exit-channel {
            position: absolute;
            bottom: 0;
            width: 50px;
            height: 40px;
            border: 2px solid #666;
            border-bottom: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: white;
        }

        .exit-channel.winning {
            background: linear-gradient(to bottom, #ff4444, #cc0000);
            border-color: #ff6666;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.7);
            animation: glow 1s ease-in-out infinite alternate;
        }

        .exit-channel.normal {
            background: linear-gradient(to bottom, #444, #222);
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 68, 68, 0.7); }
            to { box-shadow: 0 0 25px rgba(255, 68, 68, 1); }
        }

        .odds-multiplier {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .win-message {
            color: #4CAF50;
            animation: bounce 0.5s ease-in-out;
        }

        .lose-message {
            color: #f44336;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .power-bar-container {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 200px;
            background: #333;
            border: 2px solid #666;
            border-radius: 10px;
            overflow: hidden;
        }

        .power-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #4CAF50, #FFC107, #f44336);
            transition: height 0.1s ease;
            border-radius: 0 0 8px 8px;
        }

        .power-label {
            position: absolute;
            left: -15px;
            top: -25px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .setup-modal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            width: 150px;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .chip-display {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .chip-amount {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        .bet-input-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .bet-modal {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🎯 弹珠游戏</h1>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-start">开始游戏</button>
            <button id="fireBtn" class="btn btn-fire" disabled>按住蓄力发射</button>
        </div>

        <div class="game-info">
            <div class="odds-display">
                当前赔率: <span id="currentOdds">-</span>
            </div>
            <div class="chip-display">
                筹码: <span id="chips" class="chip-amount">0</span>
            </div>
            <div class="score">
                得分: <span id="score">0</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="launch-area">
                <div class="power-bar-container">
                    <div class="power-label">蓄力</div>
                    <div class="power-bar" id="powerBar"></div>
                </div>
                <div class="launch-tube" id="launchTube"></div>
                <div class="launch-curve"></div>
                <div class="launch-horizontal"></div>
            </div>
            <div class="game-container-inner" id="gameContainer">
            </div>
        </div>

        <div class="message" id="message"></div>
    </div>

    <!-- 初始筹码设置屏幕 -->
    <div class="setup-screen" id="setupScreen">
        <div class="setup-modal">
            <h2>🎯 欢迎来到弹珠游戏</h2>
            <div class="input-group">
                <label for="initialChips">请输入初始筹码 (100-10000):</label>
                <input type="number" id="initialChips" min="100" max="10000" value="1000">
            </div>
            <button id="confirmChips" class="btn btn-start">确认开始</button>
        </div>
    </div>

    <!-- 下注输入屏幕 -->
    <div class="bet-input-container" id="betInputContainer">
        <div class="bet-modal">
            <h3>💰 请输入下注金额</h3>
            <div class="input-group">
                <label for="betAmount">下注金额 (5-100):</label>
                <input type="number" id="betAmount" min="5" max="100" value="10">
            </div>
            <div style="margin: 15px 0; color: #666;">
                当前筹码: <span id="currentChipsDisplay">0</span>
            </div>
            <button id="confirmBet" class="btn btn-start">确认下注</button>
            <button id="cancelBet" class="btn" style="background: #666; color: white; margin-left: 10px;">取消</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
