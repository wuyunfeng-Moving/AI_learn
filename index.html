<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹珠游戏</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }

        .title {
            text-align: center;
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-fire {
            background: #f44336;
            color: white;
        }

        .btn-fire:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .odds-display {
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }

        .game-board {
            position: relative;
            width: 100%;
            height: 600px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #16213e;
        }

        .launch-tube {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 80px;
            background: linear-gradient(to top, #333, #555);
            border-radius: 20px 20px 0 0;
            border: 2px solid #666;
        }

        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #fff, #ff4444, #cc0000);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            transition: none;
            z-index: 100;
        }

        .peg {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle at 30% 30%, #fff, #888, #333);
            border-radius: 50%;
            border: 1px solid #555;
        }

        .exit-channel {
            position: absolute;
            bottom: 0;
            width: 60px;
            height: 40px;
            border: 2px solid #666;
            border-bottom: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
        }

        .exit-channel.winning {
            background: linear-gradient(to bottom, #ff4444, #cc0000);
            border-color: #ff6666;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.7);
            animation: glow 1s ease-in-out infinite alternate;
        }

        .exit-channel.normal {
            background: linear-gradient(to bottom, #444, #222);
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 68, 68, 0.7); }
            to { box-shadow: 0 0 25px rgba(255, 68, 68, 1); }
        }

        .odds-multiplier {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .win-message {
            color: #4CAF50;
            animation: bounce 0.5s ease-in-out;
        }

        .lose-message {
            color: #f44336;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🎯 弹珠游戏</h1>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-start">开始游戏</button>
            <button id="fireBtn" class="btn btn-fire" disabled>击发弹珠</button>
        </div>

        <div class="game-info">
            <div class="odds-display">
                当前赔率: <span id="currentOdds">-</span>
            </div>
            <div class="score">
                得分: <span id="score">0</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="launch-tube" id="launchTube"></div>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
